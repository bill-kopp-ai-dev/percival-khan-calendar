name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src/percival_khan_calendar \
            --cov-report=term-missing \
            --cov-fail-under=80

  docker:
    name: Docker build + smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Resolve build metadata
        id: meta
        run: |
          # SemVer from pyproject.toml — single source of truth.
          VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: percival-khan-calendar:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke (--version exits 0)
        run: |
          set -euo pipefail
          output=$(docker run --rm percival-khan-calendar:ci --version)
          echo "$output"
          # `-F` (fixed string) is intentional: the SemVer is literal,
          # not a regex, and a future non-numeric build suffix would
          # otherwise need escaping.
          echo "$output" | grep -Fq "Percival Khan Calendar MCP Server version ${{ steps.meta.outputs.version }}"
      - name: Smoke (--help exits 0)
        run: |
          set -euo pipefail
          output=$(docker run --rm percival-khan-calendar:ci --help)
          echo "$output" | grep -Fq "Model Context Protocol"
      - name: MCP stdio conformance (offline)
        run: >-
          python3 scripts/docker-ci-conformance.py
          --image percival-khan-calendar:ci
          --mount type=tmpfs,destination=/data,tmpfs-mode=0777
          --env KHAN_WORKSPACE_DIR=/data
          --expected-tool khan_get_status
          --expected-uid 1000
          --compose-service server
      - name: Inspect image (sanity)
        run: |
          echo "=== Size ==="
          docker images percival-khan-calendar:ci --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          echo "=== User ==="
          docker inspect percival-khan-calendar:ci --format '{{.Config.User}}'
          echo "=== Entrypoint ==="
          docker inspect percival-khan-calendar:ci --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}'
          echo "=== OCI labels ==="
          docker inspect percival-khan-calendar:ci --format '{{json .Config.Labels}}' | python3 -m json.tool
          test "$(docker inspect percival-khan-calendar:ci --format '{{.Config.User}}')" = app
          test "$(docker inspect percival-khan-calendar:ci --format '{{json .Config.ExposedPorts}}')" = "null"
          test "$(docker inspect percival-khan-calendar:ci --format '{{json .Config.Healthcheck}}')" = "null"
      - name: Write build manifest
        run: python3 scripts/write_docker_ci_manifest.py --image percival-khan-calendar:ci --source-sha "$GITHUB_SHA" --lock uv.lock --output docker-build-manifest.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: percival-khan-calendar:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence-khan-${{ github.sha }}
          path: |
            docker-build-manifest.json
            sbom.cdx.json
          if-no-files-found: error
